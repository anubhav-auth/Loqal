# Loqal Frontend — nginx routing for single Docker image
# All 5 apps are served as static SPAs; Kong terminates /api and /ws.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Landing (root)
    location / {
        root /usr/share/nginx/html/landing;
        try_files $uri $uri/ /index.html;
    }

    # Merchant dashboard
    location /merchant {
        alias /usr/share/nginx/html/merchant;
        try_files $uri $uri/ /merchant/index.html;
    }

    # Customer storefront
    location /customer {
        alias /usr/share/nginx/html/customer;
        try_files $uri $uri/ /customer/index.html;
    }

    # Admin panel
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # Delivery agent PWA
    location /agent {
        alias /usr/share/nginx/html/agent;
        try_files $uri $uri/ /agent/index.html;
    }

    # Agent service worker / PWA assets
    location /agent/ {
        alias /usr/share/nginx/html/agent/;
        try_files $uri $uri/ /agent/index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
