apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: loqal
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: loqal-platform
        url: http://loqal-platform.loqal.svc.cluster.local:8080
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local
        routes:
          - name: auth-routes
            paths: [ "~/auth", "~/.well-known/jwks.json" ]
            strip_path: false
          - name: users-routes
            paths: [ "~/users" ]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: kid
          - name: products-routes
            paths: [ "~/products" ]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: kid
          - name: orders-routes
            paths: [ "/api/orders" ]
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: kid
    consumers:
      - username: loqal-clients
    jwt_secrets:
      - consumer: loqal-clients
        # Must equal the platform's derived kid (see .env.example)
        key: "REPLACE_WITH_PLATFORM_KID"
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          REPLACE_WITH_PUBLIC_KEY_PEM
          -----END PUBLIC KEY-----
