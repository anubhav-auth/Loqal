apiVersion: apps/v1
kind: Deployment
metadata:
  name: loqal-platform
  namespace: loqal
  labels:
    app: loqal-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loqal-platform
  template:
    metadata:
      labels:
        app: loqal-platform
    spec:
      containers:
        - name: platform
          # Replace with your registry path; build via repo-root Dockerfile
          image: ghcr.io/anubhav-auth/loqal-platform:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: loqal-config
            - secretRef:
                name: loqal-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: loqal-platform
  namespace: loqal
spec:
  selector:
    app: loqal-platform
  ports:
    - port: 8080
      targetPort: 8080
