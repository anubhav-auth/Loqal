# kong.yml (DB-less mode)
# In this mode, the entire configuration for Kong lives in this file.

_format_version: "3.0"

# 1. Define Services (where to send traffic)
services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-routes
        paths:
          - ~/auth
          - /.well-known/jwks.json

  - name: user-service
    url: http://user-service:8082
    routes:
      - name: user-routes
        paths:
          - ~/users
    plugins:
      - name: jwt # Apply the JWT plugin to this service

# 2. Define Consumers (who is using the API)
consumers:
  - username: auth-service # This replaces 'curl -X POST /consumers'

# 3. Define Credentials for Consumers
# This section links credentials (like JWT keys) to consumers.
jwt_secrets:
  - consumer: auth-service # Link to the consumer created above
    # Replace {YOUR_KID} with the actual 'kid' from your JWKS endpoint.
    # To get it, run: curl http://localhost:8000/.well-known/jwks.json
    key: "b9caa68b-2996-45e1-b816-2565c28f407e" 
    algorithm: RS256
    # You must provide the FULL JWKS JSON object as a string here.
    # Example: '{"keys":[{"kty":"RSA","e":"AQAB",...}]}'
    rsa_public_key: '{"keys":[{"kty":"RSA","e":"AQAB","kid":"b9caa68b-2996-45e1-b816-2565c28f407e","n":"vg4CKVx1Rlr-zUK_Nv7JbTPrimyhYeZwPRjDaG2wZ_MuPcRvZUFTTy11R8l7mu1jpXGbnGIANKzQLx7LnA1e5e74nyoLUnNvuKBoGUjnvExUCYdb4ihkh7LzjomdQ9y4Q6dBUPg1YPVu_IKcbw2CyDEs6pJ1UPbnwGSQixLt34ohoMrvinymJZKsHDG51WWeI4lMvSCaAZ7YE5Yhd90wlB5cIomob_vdDtjfhxJY_LWa_oBefSL4oPBSyjj0HmDjnJDHYF7ZCxuVHTAm7RJl_bAMqydiDwvxc_1fQHueSp5_6UbDkexpD5f7TQ4I79RSf2bWzENbYjVc-S-MaJUrTQ"}]}'

