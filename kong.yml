_format_version: "3.0"

# All traffic routes to the single loqal-platform container.
# JWT plugin verifies RS256 tokens issued by the platform's identity module.
services:
  - name: loqal-platform
    url: http://loqal-platform:8080
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
    routes:
      - name: auth-routes
        paths:
          - ~/auth
          - ~/.well-known/jwks.json
        strip_path: false
      - name: users-routes
        paths:
          - ~/users
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
      - name: products-routes
        paths:
          - ~/products
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
      - name: orders-routes
        paths:
          - /api/orders
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid

consumers:
  - username: loqal-clients

# Paste the public key matching JWT_RSA_PUBLIC_KEY here (PEM format).
jwt_secrets:
  - consumer: loqal-clients
    key: "REPLACE_WITH_PLATFORM_KID_SEE_ENV_EXAMPLE"
    algorithm: RS256
    rsa_public_key: |
      REPLACE_WITH_PUBLIC_KEY_PEM
