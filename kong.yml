# kong.yml (DB-less mode)
# In this mode, the entire configuration for Kong lives in this file.

_format_version: "3.0"

# 1. Define Services (where to send traffic)
services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-routes
        paths:
          - ~/auth
          - /.well-known/jwks.json
        strip_path: false
   # A virtual service for EXTERNAL traffic to the user-service
  - name: user-service-public
    url: http://user-service:8082
    routes:
      - name: user-public-routes
        paths:
          - ~/users
        strip_path: false
    plugins:
      - name: jwt # PROTECTED by the JWT plugin
        config:
          key_claim_name: kid # <--- ADD THIS LINE

  # A virtual service for INTERNAL traffic to the user-service
  - name: user-service-internal
    url: http://user-service:8082
    routes:
      - name: user-internal-routes
        paths:
          - ~/internal
        strip_path: false

# 2. Define Consumers (who is using the API)
consumers:
  - username: auth-service # This replaces 'curl -X POST /consumers'

# 3. Define Credentials for Consumers
# This section links credentials (like JWT keys) to consumers.
jwt_secrets:
  - consumer: auth-service # Link to the consumer created above
    # Replace {YOUR_KID} with the actual 'kid' from your JWKS endpoint.
    # To get it, run: curl http://localhost:8000/.well-known/jwks.json
    key: "1346311f-6f90-4c3f-90f2-ece3b72e44c5" 
    algorithm: RS256
    # You must provide the FULL JWKS JSON object as a string here.
    # Example: '{"keys":[{"kty":"RSA","e":"AQAB",...}]}'
    rsa_public_key: | 
