_format_version: "3.0"

# 1. Define Services (where to send traffic)
services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-routes
        paths:
          - ~/auth
          - /.well-known/jwks.json
        strip_path: false

  - name: user-service
    url: http://user-service:8082
    routes:
      - name: user-public-routes
        paths:
          - ~/users
        strip_path: false
    plugins:
      - name: jwt
        config:
          key_claim_name: kid

  - name: product-service
    url: http://product-service:8083
    routes:
      - name: product-public-routes
        paths:
          - /products 
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid

  - name: order-service
    url: http://order-service:8084
    routes:
      - name: order-public-routes
        paths:
          - /api/orders
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: kid

consumers:
  - username: auth-service


