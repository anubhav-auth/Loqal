services:
  kong:
    image: kong:latest
    restart: always
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: debug
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    networks:
      - loqal-net

  loqal-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: loqaldb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loqal-net

  auth-service:
    build: ./backend/java/auth-service
    ports:
      - "8081:8081"
    depends_on:
      loqal-db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      STATE_CHECKER_ENABLED: ${STATE_CHECKER_ENABLED}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      DDL_AUTO_SETTING: ${DDL_AUTO_SETTING}
      ADMIN_SERVER_PORT: ${ADMIN_SERVER_PORT}
    networks:
      - loqal-net

  user-service:
    build: ./backend/java/user-service
    ports:
      - "8082:8082" ## ports are for external access only not needed for internal communication remove later
    depends_on:
      loqal-db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_SERVER_PORT: ${USER_SERVER_PORT}
    networks:
      - loqal-net

  product-service:
    build: ./backend/java/product-service
    container_name: product-service
    ports:
      - "8083:8083"
    depends_on:
      loqal-db:
        condition: service_healthy
    environment:
      - DB_URL=${DB_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PRODUCT_SERVER_PORT=${PRODUCT_SERVER_PORT}
      - JWT_JWKS_URI=${JWT_JWKS_URI}
      - DDL_AUTO_SETTING=${DDL_AUTO_SETTING}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ORDER_CREATTION_REQUESTED=${ORDER_CREATTION_REQUESTED}
      - STOCK_RESERVATION_RESULT=${STOCK_RESERVATION_RESULT}
      - ORDER_CANCEL=${ORDER_CANCEL}
      - ORDER_CANCEL_DLT=${ORDER_CANCEL_DLT}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
    networks:
      - loqal-net
    
  order-service:
    build: ./backend/java/order-service
    container_name: order-service
    ports:
      - "8084:8084"
    depends_on:
      loqal-db:
        condition: service_healthy
    environment:
      - DB_URL=${DB_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ORDER_SERVER_PORT=${ORDER_SERVER_PORT}
      - JWT_JWKS_URI=${JWT_JWKS_URI}
      - DDL_AUTO_SETTING=${DDL_AUTO_SETTING}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ORDER_CREATTION_REQUESTED=${ORDER_CREATTION_REQUESTED}
      - STOCK_RESERVATION_RESULT=${STOCK_RESERVATION_RESULT}
      - ORDER_CANCEL=${ORDER_CANCEL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
    networks:
      - loqal-net

  redis:
    image: "redis:alpine"
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - loqal-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - loqal-net
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_BROKER_ID: 1
      CLUSTER_ID: JcZNIvZbTAS9fjd4_VGuuA
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    networks:
      - loqal-net

networks:
  loqal-net:
    driver: bridge