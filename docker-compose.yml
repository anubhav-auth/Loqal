services:
  kong:
    image: kong:latest
    restart: always
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: debug
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    networks:
      - loqal-net

  loqal-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: loqaldb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loqal-net

  auth-service:
    build: ./backend/java/auth-service
    ports:
      - "8081:8081"
    depends_on:
      loqal-db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      STATE_CHECKER_ENABLED: ${STATE_CHECKER_ENABLED}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      DDL_AUTO_SETTING: ${DDL_AUTO_SETTING}
      ADMIN_SERVER_PORT: ${ADMIN_SERVER_PORT}
    networks:
      - loqal-net

  user-service:
    build: ./backend/java/user-service
    ports:
      - "8082:8082" ## ports are for external access only not needed for internal communication remove later
    depends_on:
      loqal-db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_SERVER_PORT: ${USER_SERVER_PORT}
    networks:
      - loqal-net

  product-service:
    build: ./backend/java/product-service
    ports:
      - "8083:8083"
    depends_on:
      loqal-db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRODUCT_SERVER_PORT: ${PRODUCT_SERVER_PORT}
    networks:
      - loqal-net

networks:
  loqal-net:
    driver: bridge