services:
  auth-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loqal-net

  user-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loqal-net

  auth-service:
    build: ./backend/java/auth-service
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      - AUTH_DB_URL=${AUTH_DB_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - STATE_CHECKER_ENABLED=${STATE_CHECKER_ENABLED}
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - DDL_AUTO_SETTING=${DDL_AUTO_SETTING}
      - ADMIN_SERVER_PORT=${ADMIN_SERVER_PORT}
    networks:
      - loqal-net

  user-service:
    build: ./backend/java/user-service
    ports:
      - "8082:8082"
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      - USER_DB_URL=${USER_DB_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - DDL_AUTO_SETTING=${DDL_AUTO_SETTING}
      - USER_SERVER_PORT=${USER_SERVER_PORT}
    networks:
      - loqal-net

  kong-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: kongdb # A new database specifically for Kong
      POSTGRES_USER: ${KONG_DB_USER}
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD}
    ports:
      - "5435:5432" # Use a new port to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loqal-net

  kong-migrations:
    image: kong:3.9.1-ubuntu # Using a specific stable Kong version
    command: "kong migrations bootstrap" # Command to initialize Kong's database schema
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db # Connect to the new kong-db service
      KONG_PG_USER: ${KONG_DB_USER}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
    depends_on:
      kong-db:
        condition: service_healthy # Wait for kong-db to be ready
    networks:
      - loqal-net
    # This service runs migrations once. For production, you might run this as a separate step.
    # For development, leaving it in is fine for fresh setups.

  kong:
    image: kong:3.9.1-ubuntu
    restart: on-failure
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: ${KONG_DB_USER}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout # Log proxy requests to stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout # Log admin requests to stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr # Log proxy errors to stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr # Log admin errors to stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl # Admin API listens on port 8001 (HTTP) and 8444 (HTTPS)
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl # Proxy API listens on port 8000 (HTTP) and 8443 (HTTPS)
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml # Tell Kong to load config from this file
      KONG_ANONYMOUS_REPORTS: "off" # Disable anonymous usage data reporting
    volumes:
      - ./kong/declarative:/etc/kong/ # Mount your declarative config folder into Kong
    ports:
      - "8000:8000" # Expose Kong's HTTP proxy port
      - "8443:8443" # Expose Kong's HTTPS proxy port
      - "8001:8001" # Expose Kong's HTTP Admin API port
      - "8444:8444" # Expose Kong's HTTPS Admin API port
    depends_on:
      kong-migrations:
        condition: service_completed_successfully # Ensure migrations are done
      auth-service: # Dependency to ensure services are started before Kong tries to route
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - loqal-net

networks:
  loqal-net:
    driver: bridge