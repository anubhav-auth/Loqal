spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO_SETTING}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

springdoc:
  api-docs.path: /custom-docs
  swagger-ui.path: /custom-ui.html




server:
  port: ${USER_SERVER_PORT}


jwt:


