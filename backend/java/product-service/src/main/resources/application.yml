spring:
  application:
    name: product-service
  kafka:
    topic:
      order-cancel: ${ORDER_CANCEL}
      stock-reservation-result: ${STOCK_RESERVATION_RESULT}
      order-cancel-dlt: ${ORDER_CANCEL_DLT}
      order-creation-requested: ${ORDER_CREATTION_REQUESTED}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO_SETTING}
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PRODUCT_SERVER_PORT}
  
jwt:
  jwks-uri: ${JWT_JWKS_URI}

services:
  product-service:
    url: ${PRODUCT_SERVICE_URL}
  user-service:
    url: ${USER_SERVICE_URL}