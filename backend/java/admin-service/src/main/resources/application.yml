spring:
  datasource:
    url: ${AUTH_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO_SETTING}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

springdoc:
  api-docs.path: /custom-docs
  swagger-ui.path: /custom-ui.html

services:
  user-service:
    url: ${USER_SERVICE_URL}
  merchant-service:
    url: ${MERCHANT_SERVICE_URL}

server:
  port: ${ADMIN_SERVER_PORT}



jwt:
  jwks-uri: ${JWT_JWKS_URI}
