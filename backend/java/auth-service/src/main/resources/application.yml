spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO_SETTING}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}

springdoc:
  api-docs.path: /custom-docs
  swagger-ui.path: /custom-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${ACCESS_TOKEN_EXPIRY}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRY}

state-checker:
  enabled: ${STATE_CHECKER_ENABLED}

services:
  user-service:
    url: ${USER_SERVICE_URL}

server:
  port: ${ADMIN_SERVER_PORT}
